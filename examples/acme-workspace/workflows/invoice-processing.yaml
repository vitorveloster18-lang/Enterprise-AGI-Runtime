id: invoice-processing
name: Processamento de nota fiscal
version: 1.0.0
description: >
  Vertical contábil: documento -> validação -> política -> execução.
  Cada passo vira uma task auditada; a dependência é declarada (DAG), não
  implícita pela ordem do arquivo.
environment: development
on_error: fail # fail | continue | compensate
trigger:
  type: event
  event: invoice.received
# Fase 6: paralelismo opcional entre passos independentes do mesmo nível
parallel: false
max_parallel: 4
inputs:
  origem: upload
steps:
  - id: s1
    agent: document-agent
    objective: Extrair e classificar as informações da nota fiscal recebida
    outputs:
      fornecedor: "{{task.answer}}"
  - id: s2
    agent: finance-agent
    depends_on: [s1]
    objective: Validar os dados extraídos contra o histórico e as regras financeiras
    max_attempts: 2 # retry automático, auditado em `attempts`
  - id: s3
    depends_on: [s2]
    policy: finance-payment
    tool: database.query
    args:
      sql: select id, status from tasks order by created_at desc limit 5
  - id: s4
    depends_on: [s3]
    condition: "inputs['origem'] == 'upload'"
    objective: Registrar o resultado da conciliação na memória do namespace finance
    namespace: finance
