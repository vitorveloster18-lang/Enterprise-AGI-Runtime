# EGR — Enterprise AGI Runtime
#
# Este arquivo é a configuração do workspace. Segredos NUNCA ficam aqui:
# use `api_key_env` (nome de variável de ambiente) ou o placeholder ${env:VAR}.
#
# Exemplo de configuração de modelos (descomente e ajuste):
#
# models:
#   routing: cost                 # priority | cost | local_first
#   budget:
#     currency: USD
#     per_task: 0.50              # teto por task
#     per_day: 5.00               # teto por dia
#     on_exceeded: deny           # deny | warn
#   providers:
#     - name: local
#       type: ollama              # modelo local: os dados não saem da máquina
#       base_url: http://localhost:11434
#       model: llama3.1
#       capabilities: [reasoning, chat]
#       priority: 100
#     - name: cloud
#       type: openai_compat       # OpenAI, Groq, OpenRouter, vLLM, LM Studio...
#       base_url: https://api.openai.com/v1
#       api_key_env: OPENAI_API_KEY
#       model: gpt-4o-mini
#       external: true            # cruza a fronteira da empresa (Data Boundary)
#       priority: 10
#       pricing:                  # USD por 1M de tokens (base do orçamento)
#         input_per_1m: 0.15
#         output_per_1m: 0.60
#
version: 1
enterprise:
  id: acme
  name: ACME Contabilidade
  settings:
    data_residency: local
    external_ai: allowed
    audit_retention_days: 365
    default_environment: development
environment: development
paths:
  database: .egr/egr.db
  sandbox: .egr/sandbox
  artifacts: artifacts
  logs: logs
  documents: documents
models:
  routing: cost
  budget:
    currency: USD
    per_task: 0.05
    per_day: 2.00
    on_exceeded: deny
  providers:
    # O echo e local e gratuito; o preco abaixo e ILUSTRATIVO, apenas para que o
    # calculo de custo e o orcamento aparecam no demo sem nenhum modelo real.
    - name: echo
      type: echo
      enabled: true
      capabilities:
        - reasoning
        - chat
      priority: 0
      external: false
      pricing:
        currency: USD
        input_per_1m: 0.30
        output_per_1m: 1.20
        per_call: 0.0
security:
  python_exec_enabled: true
  allow_network_tools: true
  redact_secrets: true
  sanitize_external_payloads: true
  allowed_write_roots:
    - artifacts
    - .egr/sandbox
gateway:
  enabled: true              # Telegram/Slack/Web falam com o mesmo Runtime
  require_pairing: true      # default deny: sem pareamento, nada executa
  rate_limit_per_minute: 10
  channels:
    - name: web
      type: web              # chat em /chat (console web)
      enabled: true
      default_agent: document-agent
integrations:
  enabled: true                  # conectores continuam nascendo desabilitados
  max_response_chars: 4000
  default_timeout: 20
  redact: true                   # segredo nunca entra na trilha
  allow_sql_drivers: [sqlite]    # driver novo é declaração, não descoberta
runtime:
  max_steps: 8
  tool_timeout: 30
  model_timeout: 120
  auto_approve_in_development: false
  pause_on_approval: true
mcp:
  enabled: true
  servers:
    - name: calculadora
      command: python
      args:
        - servers/calculadora.py
      enabled: true
      timeout: 15
logging:
  level: INFO
  file: true
