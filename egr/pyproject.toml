[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egr"
version = "0.1.0"
description = "Enterprise AGI Runtime - local, governed runtime where any model can do real work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.5",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]

[project.scripts]
egr = "egr.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
egr = ["migrations/*.sql", "templates/workspace/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "SIM103", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# typer/click idiom: Option(...) and Argument(...) live in the signature
"src/egr/cli/**" = ["B008", "UP007"]
# the local console embeds an HTML/JS template
"src/egr/api/server.py" = ["E501"]
"tests/**" = ["B008"]
