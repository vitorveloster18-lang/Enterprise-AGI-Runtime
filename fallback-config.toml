# Fallback Configuration for Salem
# Prioridade: Kimi Cloud → Qwen Local → Gemini API

[[models]]
name = "kimi-cloud"
provider = "ollama"
model = "kimi-k2.5:cloud"
# endpoint = "URL_DO_SERVICO_CLOUD"
priority = 1

[[models]]
name = "qwen-local"
provider = "ollama"
model = "qwen2.5:7b"
endpoint = "http://localhost:11434"
priority = 2
fallback = true

